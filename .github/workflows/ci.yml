name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        database: [h2, postgres]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: task_manager_test
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: ${{ matrix.database == 'postgres' && 'jdbc:postgresql://localhost:5432/task_manager_test' || 'jdbc:h2:mem:task_manager_test;DB_CLOSE_DELAY=-1' }}
      TEST_DATABASE_USERNAME: ${{ matrix.database == 'postgres' && 'test' || 'sa' }}
      TEST_DATABASE_PASSWORD: ${{ matrix.database == 'postgres' && 'test' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare frontend and application
        run: make setup
      - name: Check formatting, test API and enforce coverage
        run: ./gradlew check jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports-${{ matrix.database }}
          path: |
            build/reports/tests/test
            build/reports/jacoco/test
            build/test-results/test
